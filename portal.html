<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="theme-color" content="#801425">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>SAFE Client Portal</title>
  <meta name="description" content="SAFE Legal Solutions – client portal for policies and agreements">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/app.css">
  <link rel="icon" type="image/png" href="assets/favicon.png">
</head>
<body class="portal">
  <header class="topbar">
    <div class="brand">
      <img class="brand-logo" src="assets/logo.png" alt="SAFE Legal Solutions">
      <div>
        <div class="brand-name">Client Portal</div>
        <div class="brand-sub">SAFE Legal Solutions</div>
      </div>
    </div>
    <div class="topbar-right">
      <span id="clientBadge" class="mode-badge" hidden></span>
      <button class="btn ghost" data-action="logout" id="logoutBtn" hidden>Sign out</button>
    </div>
  </header>
  <main id="main" class="portal-main" tabindex="-1"></main>
  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <div class="modal-head"><h2 id="modalTitle"></h2><button class="icon-btn" data-action="close-modal" aria-label="Close">×</button></div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>
  <div id="toast" class="toast" hidden></div>
  <footer class="portal-footer">SAFE Legal Solutions · Bengaluru · <a href="mailto:info@safelegal.org">info@safelegal.org</a> · +91 98861 81839 · <a href="https://safelegal.in" target="_blank" rel="noopener">safelegal.in</a></footer>

  <script src="assets/js/industries.js"></script>
  <script src="assets/js/catalog.js"></script>
  <script src="assets/js/portal.js"></script>
</body>
</html>
