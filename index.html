<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="theme-color" content="#801425">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAFE Policy Studio</title>
  <meta name="description" content="SAFE Legal Solutions – policy and agreement generator for client companies">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/app.css?v=20261029d">
  <link rel="icon" type="image/png" href="assets/favicon.png">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="brand-logo" src="assets/logo.png" alt="SAFE Legal Solutions">
      <div>
        <div class="brand-name">SAFE Policy Studio</div>
        <div class="brand-sub">SAFE Legal Solutions</div>
      </div>
    </div>
    <div class="topbar-right">
      <span id="modeBadge" class="mode-badge"></span>
      <button class="btn ghost" data-action="open-reminders" id="reminderBtn" title="Renewals and reminders">Renewals <span id="dueCount" class="count-pill" hidden></span></button>
      <button class="btn ghost" data-action="open-settings">Settings</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <button class="btn primary block" data-action="new-client">+ New client</button>
      <input id="clientSearch" class="input" type="search" placeholder="Search clients" aria-label="Search clients">
      <nav id="clientList" class="client-list" aria-label="Clients"></nav>
      <button class="link-btn" data-action="go-home">Dashboard</button>
    </aside>
    <main id="main" class="main" tabindex="-1"></main>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <div class="modal-head"><h2 id="modalTitle"></h2><button class="icon-btn" data-action="close-modal" aria-label="Close">×</button></div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>
  <div id="toast" class="toast" hidden></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="assets/js/industries.js?v=20261029d"></script>
  <script src="assets/js/catalog.js?v=20261029d"></script>
  <script src="assets/js/engine.js?v=20261029d"></script>
  <script src="assets/js/templates/01-hr-foundation.js?v=20261029d"></script>
  <script src="assets/js/templates/02-hr-time-pay-leave.js?v=20261029d"></script>
  <script src="assets/js/templates/03-hr-conduct.js?v=20261029d"></script>
  <script src="assets/js/templates/04-hr-separation-compliance.js?v=20261029d"></script>
  <script src="assets/js/templates/05-insurance.js?v=20261029d"></script>
  <script src="assets/js/templates/06-data-space-agreements.js?v=20261029d"></script>
  <script src="assets/js/docxgen.js?v=20261029d"></script>
  <script src="assets/js/store.js?v=20261029d"></script>
  <script src="assets/js/app.js?v=20261029d"></script>
</body>
</html>
